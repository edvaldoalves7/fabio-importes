# Porta do servidor (mesma do sistema antigo)
server.port=3000

# Banco de dados relacional SQLite, salvo no arquivo fabio.db
spring.datasource.url=${DB_URL:jdbc:sqlite:./fabio.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite trabalha melhor com uma conexao por vez (app local, 1 usuario)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Nao mostrar muito log no console
logging.level.org.springframework=WARN
